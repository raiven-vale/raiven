<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOID//CLICK</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050508;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

/* Background grid */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

/* Glow */
body::after {
    content: "";
    position: fixed;
    width: 700px;
    height: 700px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(
        circle,
        rgba(0,255,255,0.08),
        transparent 65%
    );
    pointer-events: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
}

/* Top bar */
#topbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 80px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 30px;

    border-bottom: 1px solid rgba(255,255,255,0.12);
    background: rgba(5,5,8,0.8);

    z-index: 10;
}

#title {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 4px;
}

#stats {
    display: flex;
    gap: 30px;
    font-size: 14px;
    letter-spacing: 2px;
}

.stat span {
    color: #00ffff;
}

/* Game area */
#arena {
    position: absolute;
    top: 80px;
    left: 0;
    right: 0;
    bottom: 70px;

    overflow: hidden;
}

/* Target */
.target {
    position: absolute;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    border: 2px solid #00ffff;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #00ffff 15%,
            rgba(0,255,255,0.3) 35%,
            transparent 70%
        );

    box-shadow:
        0 0 10px #00ffff,
        0 0 25px rgba(0,255,255,0.7);

    cursor: pointer;

    transform: translate(-50%, -50%);

    animation: targetPulse 0.8s infinite alternate;

    z-index: 5;
}

.target:hover {
    transform: translate(-50%, -50%) scale(1.15);
}

@keyframes targetPulse {
    from {
        box-shadow:
            0 0 8px #00ffff,
            0 0 20px rgba(0,255,255,0.5);
    }

    to {
        box-shadow:
            0 0 15px #00ffff,
            0 0 35px rgba(0,255,255,0.9);
    }
}

/* Hit effect */
.hit {
    position: absolute;

    width: 10px;
    height: 10px;

    border: 2px solid #00ffff;
    border-radius: 50%;

    transform: translate(-50%, -50%);

    animation: hitEffect 0.35s forwards;

    pointer-events: none;
}

@keyframes hitEffect {
    from {
        width: 10px;
        height: 10px;
        opacity: 1;
    }

    to {
        width: 100px;
        height: 100px;
        opacity: 0;
    }
}

/* Start screen */
#message {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: rgba(5,5,8,0.88);

    z-index: 20;

    text-align: center;
}

#message h1 {
    font-size: 48px;
    letter-spacing: 8px;
    margin: 0 0 10px;

    text-shadow:
        0 0 10px #00ffff,
        0 0 30px rgba(0,255,255,0.5);
}

#message p {
    color: #aaa;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

/* Buttons */
button {
    padding: 13px 28px;

    border: 1px solid #00ffff;
    background: transparent;
    color: #00ffff;

    font-size: 14px;
    letter-spacing: 3px;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #00ffff;
    color: #050508;

    box-shadow:
        0 0 15px #00ffff,
        0 0 30px rgba(0,255,255,0.5);
}

/* Bottom bar */
#bottom {
    position: absolute;
    bottom: 0;
    left: 0;

    width: 100%;
    height: 70px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-top: 1px solid rgba(255,255,255,0.12);

    z-index: 10;
}

.back {
    position: absolute;
    left: 25px;
}

#instructions {
    color: #666;
    font-size: 12px;
    letter-spacing: 2px;
}

/* Mobile */
@media (max-width: 600px) {

    #topbar {
        padding: 0 15px;
    }

    #title {
        font-size: 17px;
        letter-spacing: 2px;
    }

    #stats {
        gap: 10px;
        font-size: 10px;
    }

    #message h1 {
        font-size: 30px;
        letter-spacing: 5px;
    }

    .target {
        width: 48px;
        height: 48px;
    }

    #instructions {
        display: none;
    }

    .back {
        left: 15px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- TOP BAR -->
    <div id="topbar">

        <div id="title">
            VOID//CLICK
        </div>

        <div id="stats">
            <div class="stat">
                SCORE <span id="score">0</span>
            </div>

            <div class="stat">
                TIME <span id="time">30</span>
            </div>
        </div>

    </div>


    <!-- GAME AREA -->
    <div id="arena"></div>


    <!-- START / GAME OVER SCREEN -->
    <div id="message">

        <h1>VOID//CLICK</h1>

        <p id="messageText">
            HIT THE TARGETS BEFORE TIME RUNS OUT
        </p>

        <button onclick="startGame()">
            START
        </button>

    </div>


    <!-- BOTTOM BAR -->
    <div id="bottom">

        <button
            class="back"
            onclick="location.href='../index.html'">
            ← ARCADE
        </button>

        <div id="instructions">
            CLICK THE TARGET // 30 SECOND PROTOCOL
        </div>

    </div>

</div>


<script>

const arena = document.getElementById("arena");
const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");

const message = document.getElementById("message");
const messageText = document.getElementById("messageText");

let score = 0;
let timeLeft = 30;
let gameRunning = false;

let timer;
let target;


/* =========================
   START GAME
========================= */

function startGame() {

    score = 0;
    timeLeft = 30;

    scoreDisplay.textContent = score;
    timeDisplay.textContent = timeLeft;

    gameRunning = true;

    message.style.display = "none";

    clearInterval(timer);

    timer = setInterval(() => {

        timeLeft--;

        timeDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
            endGame();
        }

    }, 1000);

    createTarget();
}


/* =========================
   CREATE TARGET
========================= */

function createTarget() {

    // Remove old target
    if (target) {
        target.remove();
    }

    target = document.createElement("div");

    target.className = "target";

    /*
       Keep the target away from
       the edges so it doesn't
       become impossible to click.
    */

    const padding = 40;

    const arenaWidth = arena.clientWidth;
    const arenaHeight = arena.clientHeight;

    const x =
        padding +
        Math.random() * (arenaWidth - padding * 2);

    const y =
        padding +
        Math.random() * (arenaHeight - padding * 2);

    target.style.left = x + "px";
    target.style.top = y + "px";

    target.onclick = hitTarget;

    arena.appendChild(target);
}


/* =========================
   TARGET HIT
========================= */

function hitTarget(event) {

    if (!gameRunning) return;

    event.stopPropagation();

    score++;

    scoreDisplay.textContent = score;

    /*
       Create expanding hit effect
    */

    const effect = document.createElement("div");

    effect.className = "hit";

    effect.style.left = target.style.left;
    effect.style.top = target.style.top;

    arena.appendChild(effect);

    setTimeout(() => {
        effect.remove();
    }, 350);

    /*
       Create another target
    */

    createTarget();
}


/* =========================
   END GAME
========================= */

function endGame() {

    gameRunning = false;

    clearInterval(timer);

    if (target) {
        target.remove();
    }

    messageText.innerHTML =
        "FINAL SCORE: <strong>" + score + "</strong>";

    message.querySelector("button").textContent = "RETRY";

    message.style.display = "flex";
}


/* =========================
   PREVENT ACCIDENTAL ARENA
   CLICKS
========================= */

arena.addEventListener("click", function(event) {

    if (!gameRunning) return;

    /*
       Clicking empty space does nothing.
       Only the target counts.
    */

});


</script>

</body>
</html>
